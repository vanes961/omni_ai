name: Android installable APK

on:
  push:
    branches:
      - feat/ai-engine-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify Flutter and build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable Android debug signing key
        id: signing_key_cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: omni-ai-stable-debug-keystore-v1

      - name: Require the established signing key
        if: steps.signing_key_cache.outputs.cache-hit != 'true'
        run: |
          echo "::error::The established Android debug signing key was not restored. Refusing to generate a different key that could break app upgrades."
          exit 1

      - name: Verify restored signing key exists
        run: test -f "$HOME/.android/debug.keystore"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Set up Gradle for libtorrent4j compatibility verification
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Verify pinned libtorrent4j artifacts and Android ABIs
        run: gradle -p android :app:verifyLibtorrent4jArtifacts

      # Formatting debt already exists across the branch and must not prevent
      # us from getting real analyzer, test, and APK build results.
      - name: Analyze Flutter code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build compact arm64 release APK without bundled model
        run: flutter build apk --release --target-platform android-arm64

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: omni-ai-android-arm64-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
