name: Android installable APK

on:
  push:
    branches:
      - feat/ai-engine-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify Flutter and build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable Android debug signing key
        id: signing_key_cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: omni-ai-stable-debug-keystore-v1

      - name: Require the established signing key
        if: steps.signing_key_cache.outputs.cache-hit != 'true'
        run: |
          echo "::error::The established Android debug signing key was not restored. Refusing to generate a different key that could break app upgrades."
          exit 1

      - name: Verify restored signing key exists
        run: test -f "$HOME/.android/debug.keystore"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Set up Gradle for libtorrent4j compatibility verification
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Verify pinned libtorrent4j artifacts and Android ABIs
        run: gradle -p android :app:verifyLibtorrent4jArtifacts

      # Formatting debt already exists across the branch and must not prevent
      # us from getting real analyzer, test, and APK build results.
      - name: Analyze Flutter code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Cache bundled Qwen model
        id: qwen-cache
        uses: actions/cache@v4
        with:
          path: android/app/src/main/assets/models/Qwen_Qwen3-0.6B-Q4_K_M.gguf
          key: qwen3-0.6b-q4-k-m-9acfc1e001311f34b4252001b626f2e466d592a42065f66571bff3790d4e1b14

      - name: Download bundled Qwen model
        if: steps.qwen-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p android/app/src/main/assets/models
          curl --location --fail --retry 3 --retry-delay 2 \
            'https://huggingface.co/SandLogicTechnologies/Qwen3-GGUF/resolve/main/Qwen_Qwen3-0.6B-Q4_K_M.gguf' \
            --output android/app/src/main/assets/models/Qwen_Qwen3-0.6B-Q4_K_M.gguf

      - name: Verify bundled Qwen model before packaging
        run: |
          echo '9acfc1e001311f34b4252001b626f2e466d592a42065f66571bff3790d4e1b14  android/app/src/main/assets/models/Qwen_Qwen3-0.6B-Q4_K_M.gguf' | sha256sum --check
          test "$(stat -c%s android/app/src/main/assets/models/Qwen_Qwen3-0.6B-Q4_K_M.gguf)" -ge 459800000

      - name: Build full release APK with bundled Qwen model
        run: flutter build apk --release

      - name: Verify APK package, alignment, and signing identity
        if: always() && hashFiles('build/app/outputs/flutter-apk/app-release.apk') != ''
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name zipalign | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          test -n "$AAPT"
          test -n "$ZIPALIGN"

          echo '--- Validate APK archive ---'
          unzip -t "$APK" | tail -n 2
          echo '--- Verify the Qwen model is embedded in the APK ---'
          MODEL_ASSET='assets/models/Qwen_Qwen3-0.6B-Q4_K_M.gguf'
          unzip -Z1 "$APK" | grep -Fx "$MODEL_ASSET"
          MODEL_SHA="$(unzip -p "$APK" "$MODEL_ASSET" | sha256sum | awk '{print $1}')"
          MODEL_BYTES="$(unzip -p "$APK" "$MODEL_ASSET" | wc -c)"
          echo "Embedded model bytes: $MODEL_BYTES"
          echo "Embedded model SHA-256: $MODEL_SHA"
          test "$MODEL_BYTES" -ge 459800000
          test "$MODEL_SHA" = '9acfc1e001311f34b4252001b626f2e466d592a42065f66571bff3790d4e1b14'
          "$ZIPALIGN" -c -v 4 "$APK"
          echo '--- Validate Android package metadata ---'
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='com.omniai.omni_ai'"
          printf '%s\n' "$BADGING" | grep -E "^sdkVersion:"
          printf '%s\n' "$BADGING" | grep -E "^native-code:"
          echo '--- Verify restored signing key certificate ---'
          KEY_SHA="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | awk -F'SHA256: ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          echo "Keystore SHA-256: $KEY_SHA"
          echo '--- Verify built APK certificate ---'
          APK_SHA="$("$APKSIGNER" verify --verbose --print-certs "$APK" | awk -F': ' '/certificate SHA-256 digest:/{print $NF; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          echo "APK SHA-256: $APK_SHA"
          test -n "$KEY_SHA"
          test -n "$APK_SHA"
          if [ "$KEY_SHA" != "$APK_SHA" ]; then
            echo "::error::APK signing certificate does not match the restored stable key. Refusing to publish an incompatible APK."
            exit 1
          fi
          echo "APK package structure and signing identity verified."

      - name: Publish full APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: omni-ai-android-full-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 90
