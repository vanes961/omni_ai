name: Android test APK

on:
  push:
    branches:
      - feat/ai-engine-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify Flutter and build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Keep this verification focused on the current media playback work.
      # Legacy formatting elsewhere in the repository must not block the APK test run.
      - name: Check media formatting
        run: dart format --output=none --set-exit-if-changed lib/features/media test/*media* test/torrserver*

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: omni-ai-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
