name: OMNI_AI Flutter CI

on:
  push:
    branches:
      - feat/ai-engine-foundation
  pull_request:
    branches:
      - feat/ai-engine-foundation
  workflow_dispatch:
    inputs:
      build_apk:
        description: "Build and publish a debug APK with the bundled Qwen model"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: omni-ai-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze and test Flutter code
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Keep the Android debug signing identity stable between hosted runners.
      # The cache is refreshed by every validation run and reused by APK builds.
      - name: Restore established Android debug signing key
        id: signing_key_cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: omni-ai-stable-debug-keystore-v1

      - name: Require the established signing key
        if: steps.signing_key_cache.outputs.cache-hit != 'true'
        run: |
          echo "::error::The established Android debug signing key was not restored. Refusing to generate a different key that could break app upgrades."
          exit 1

      - name: Verify restored signing key exists
        run: test -f "$HOME/.android/debug.keystore"

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: |
          files="$(git diff --name-only --diff-filter=ACMRT HEAD~5 HEAD -- 'lib/**/*.dart' 'test/**/*.dart')"
          if [ -n "$files" ]; then
            dart format --output=none --set-exit-if-changed $files || { echo '--- formatter output ---'; dart format --output=show $files; exit 1; }
          else
            echo "No changed Dart files found against main."
          fi

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Isolate each news-context chat test (diagnostic)
        timeout-minutes: 4
        run: |
          set +e
          timeout --signal=TERM --kill-after=5s 80s flutter test test/ai_chat_news_context_test.dart --plain-name 'passes cached personalized news to the provider for news questions' --reporter expanded --timeout=30s > /tmp/news-context-first.log 2>&1
          first_status=$?
          cat /tmp/news-context-first.log
          echo "FIRST_NEWS_CONTEXT_TEST_EXIT=$first_status"

          timeout --signal=TERM --kill-after=5s 80s flutter test test/ai_chat_news_context_test.dart --plain-name 'does not add cached news to unrelated chat questions' --reporter expanded --timeout=30s > /tmp/news-context-second.log 2>&1
          second_status=$?
          cat /tmp/news-context-second.log
          echo "SECOND_NEWS_CONTEXT_TEST_EXIT=$second_status"

          if [ "$first_status" -ne 0 ] || [ "$second_status" -ne 0 ]; then
            exit 1
          fi

      - name: Run full test suite with per-test timeout and expanded diagnostics
        timeout-minutes: 22
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 20m flutter test --reporter expanded --timeout=2m

  build-apk:
    name: Build small Android APK (manual / requested)
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.build_apk == true ||
      github.event_name == 'push' && contains(github.event.head_commit.message, '[build-apk]')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore established Android debug signing key
        id: signing_key_cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: omni-ai-stable-debug-keystore-v1

      - name: Require the established signing key
        if: steps.signing_key_cache.outputs.cache-hit != 'true'
        run: |
          echo "::error::The established Android debug signing key was not restored. Refusing to generate a different key that could break app upgrades."
          exit 1

      - name: Verify restored signing key exists
        run: test -f "$HOME/.android/debug.keystore"

      - name: Cache bundled Qwen model
        id: qwen-cache
        uses: actions/cache@v4
        with:
          path: android/app/src/main/assets/models/Qwen_Qwen3-0.6B-Q4_K_M.gguf
          key: qwen3-0.6b-q4-k-m-9acfc1e001311f34b4252001b626f2e466d592a42065f66571bff3790d4e1b14

      - name: Download bundled Qwen model
        if: steps.qwen-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p android/app/src/main/assets/models
          curl --location --fail --retry 3 --retry-delay 2 \
            'https://huggingface.co/SandLogicTechnologies/Qwen3-GGUF/resolve/main/Qwen_Qwen3-0.6B-Q4_K_M.gguf' \
            --output android/app/src/main/assets/models/Qwen_Qwen3-0.6B-Q4_K_M.gguf

      - name: Verify bundled Qwen model
        run: |
          echo '9acfc1e001311f34b4252001b626f2e466d592a42065f66571bff3790d4e1b14  android/app/src/main/assets/models/Qwen_Qwen3-0.6B-Q4_K_M.gguf' | sha256sum --check
          test "$(stat -c%s android/app/src/main/assets/models/Qwen_Qwen3-0.6B-Q4_K_M.gguf)" -ge 459800000

      - name: Build debug APK with bundled Qwen model
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: omni-ai-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
