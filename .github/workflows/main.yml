
name: OMNI_AI Flutter CI

on:
  push:
    branches:
      - feat/ai-engine-foundation
  pull_request:
    branches:
      - feat/ai-engine-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omni-ai-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: |
          dart format --output=none --set-exit-if-changed lib test || {
            dart format lib/features/ai_chat/presentation/ai_chat_page.dart test/core/ai_engine/routing_ai_provider_test.dart lib/features/settings/presentation/pages/local_model_settings_page.dart test/core/ai_engine/ai_context_manager_test.dart
            git diff -- lib/features/ai_chat/presentation/ai_chat_page.dart test/core/ai_engine/routing_ai_provider_test.dart lib/features/settings/presentation/pages/local_model_settings_page.dart test/core/ai_engine/ai_context_manager_test.dart
            exit 1
          }

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: omni-ai-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
