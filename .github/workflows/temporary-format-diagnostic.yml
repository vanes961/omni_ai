name: Temporary Dart format diagnostic
on:
  push:
    branches:
      - feat/ai-engine-foundation
    paths:
      - 'test/news_center_page_test.dart'
      - '.github/workflows/temporary-format-diagnostic.yml'
jobs:
  format-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Print formatted widget test
        run: dart format --output=show test/news_center_page_test.dart
