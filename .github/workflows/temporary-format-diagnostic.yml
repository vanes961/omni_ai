name: Temporary Dart format diagnostic
on:
  push:
    branches:
      - feat/ai-engine-foundation
    paths:
      - 'lib/features/news/presentation/news_center_page.dart'
      - '.github/workflows/temporary-format-diagnostic.yml'
jobs:
  format-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve dependencies
        run: flutter pub get
      - name: Print formatted news page
        run: dart format --output=show lib/features/news/presentation/news_center_page.dart
