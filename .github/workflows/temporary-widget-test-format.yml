name: Temporary widget test formatter

on:
  push:
    branches:
      - feat/ai-engine-foundation
    paths:
      - ".github/workflows/temporary-widget-test-format.yml"
      - "test/widget_test.dart"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-engine-foundation
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
      - name: Format widget test
        run: dart format test/widget_test.dart
      - name: Commit formatter output
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add test/widget_test.dart
            git commit -m "style: format startup orientation widget test"
            git push origin feat/ai-engine-foundation
          else
            echo "Widget test already formatted."
          fi
